name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Check version and CHANGELOG
        run: npm run check-version
        env:
          BASE_REF: ${{ github.base_ref }}

  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run
      - name: Smoke test engly init
        run: |
          cli="$PWD/dist/cli.js"
          project="$(mktemp -d)"
          cd "$project"
          node "$cli" --version
          node "$cli" init --yes
          test -f CLAUDE.md
          test -f .engly/config.json
          test -f .engly/engly.md
          test -f .claude/skills/engly-review/SKILL.md
          grep -q '@.engly/engly.md' CLAUDE.md
      - name: Smoke test install.sh
        run: |
          work="$(mktemp -d)"
          git archive --prefix=engly/ -o "$work/source.tar.gz" HEAD
          export npm_config_prefix="$work/global"
          ENGLY_TARBALL="file://$work/source.tar.gz" sh install.sh
          "$work/global/bin/engly" --version

  min-node:
    name: Minimum Node (22.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dev tooling needs a newer Node, so only the runtime dependencies are installed here.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - name: Install runtime dependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev
      - name: Smoke test engly init
        run: |
          cli="$PWD/dist/cli.js"
          project="$(mktemp -d)"
          cd "$project"
          node --version
          node "$cli" init --yes
          grep -q '@.engly/engly.md' CLAUDE.md

  required-checks:
    name: Required checks
    if: always()
    needs: [version, quality, min-node]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required checks passed"
